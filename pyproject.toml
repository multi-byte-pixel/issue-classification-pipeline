[project]
name = "issue-classification-pipeline"
version = "0.1.0"
description = "Pipeline-first synthetic AI evaluation learning scaffold"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "boto3>=1.35,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_classifier", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: explicitly authorized cloud tests, not part of local CI"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
