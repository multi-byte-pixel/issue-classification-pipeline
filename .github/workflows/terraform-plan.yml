name: Terraform static validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.12.2"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments/dev init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/environments/dev validate
      # Intentionally no OIDC on PRs. Credentialed plans use the manual dev workflow.
