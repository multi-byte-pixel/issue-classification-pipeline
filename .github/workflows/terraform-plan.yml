name: Terraform static validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.12.2"
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments/dev init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/environments/dev validate
      # Intentionally no OIDC on PRs. Credentialed plans use the manual dev workflow.
